<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <script src="/theme.js"></script><link rel="stylesheet" href="/startup.css"><script src="/startup.js" defer></script><title>FRB Control Center</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico?v=frb-cc-1" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=frb-cc-1">
  <link rel="stylesheet" href="/styles.css">
  <script src="/branch-labels.js" defer></script>
  <script src="/performance.js" defer></script>
  <script src="/keeta-performance.js" defer></script>
  <script src="/noon-performance.js" defer></script>
  <link rel="stylesheet" href="/noon-performance.css">
  <script src="/auth.js" defer></script>
  <script src="/report-cache.js" defer></script>
  <script src="/ratings-export.js" defer></script>
  <script src="/growth.js" defer></script>
  <link rel="stylesheet" href="/growth.css">
  <script src="/app.js" defer></script>
<link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/brand.css"></head>
<body>
  <section class="startup-screen" id="startupScreen" aria-label="Loading FRB Control Center"><div class="startup-content"><svg class="startup-symbol" viewBox="10 10 80 80" aria-hidden="true"><path class="startup-arc-primary" d="M58 10H38A28 28 0 0 0 10 38v12a28 28 0 0 0 28 28h4V58h-4a8 8 0 0 1-8-8V38a8 8 0 0 1 8-8h20Z" fill="#FFFFFF"/><path class="startup-arc-secondary" d="M62 22h0a28 28 0 0 1 28 28v12a28 28 0 0 1-28 28H42V70h20a8 8 0 0 0 8-8V50a8 8 0 0 0-8-8Z" fill="#10A878"/><path class="startup-center" d="M40 40h20v20H40Z" fill="#10A878"/></svg><p class="startup-brand">FRB</p><p class="startup-title">Control Center</p><p class="startup-message" id="startupMessage" role="status" aria-live="polite">Preparing your dashboard…</p><div class="startup-progress" aria-hidden="true"></div><button class="startup-retry" id="startupRetry" type="button" hidden>Try again</button><noscript><p>Enable JavaScript to open the dashboard.</p></noscript></div></section>

  <header class="topbar">
    <div class="brand-mark" aria-hidden="true"><img src="/brand/mark-dark.svg" class="brand-dark" alt=""><img src="/brand/mark-light.svg" class="brand-light" alt=""></div>
    <div class="brand-copy">
      <span class="brand-endorsement">FRB</span>
      <h1>Control Center</h1>
    </div>
    <div class="refresh-state" id="refreshState">
      <span class="live-dot"></span>
      <span>Loading data…</span>
    </div>
    <div class="account-menu" id="accountMenu" hidden>
      <span id="accountName"></span>
      <button class="account-button" id="manageUsers" type="button" hidden>Users</button>
      <button class="account-button" id="manageBranches" type="button" hidden>Branches</button>
      <button class="account-button" id="logoutButton" type="button">Log out</button>
    </div>
  </header>

  <nav class="platform-tabs" id="platformTabs" aria-label="Platforms">
    <button class="tab active" data-tab="overview"><img class="tab-logo" src="/platforms/overview.svg" alt=""><span class="tab-label">Overview</span></button>
    <button class="tab" data-tab="growth"><svg class="tab-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 3 8-9m-6 0h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tab-label">Growth</span></button>
    <button class="tab" data-tab="talabat"><img class="tab-logo" src="/platforms/talabat-icon.png" alt=""><span class="tab-label">Talabat</span><span class="tab-state">Checking…</span></button>
    <button class="tab" data-tab="keeta"><img class="tab-logo" src="/platforms/keeta-icon.png" alt=""><span class="tab-label">Keeta</span><span class="tab-state">Not Connected</span></button>
    <button class="tab" data-tab="noon"><img class="tab-logo" src="/platforms/noon-icon.png" alt=""><span class="tab-label">Noon</span><span class="tab-state">Not Connected</span></button>
    <button class="tab" data-tab="careem"><img class="tab-logo" src="/platforms/careem-icon.png" alt=""><span class="tab-label">Careem</span><span class="tab-state">Not Connected</span></button>
    <button class="tab" data-tab="deliveroo"><img class="tab-logo" src="/platforms/deliveroo-icon.png" alt=""><span class="tab-label">Deliveroo</span><span class="tab-state">Not Connected</span></button>
  </nav>

  <nav class="talabat-view-tabs" id="talabatViewTabs" aria-label="Talabat views" hidden>
    <button class="talabat-view active" data-talabat-view="talabat" type="button">Ratings</button>
    <button class="talabat-view" data-talabat-view="performance" type="button">Performance</button>
  </nav>
  <nav class="talabat-view-tabs" id="noonViewTabs" aria-label="Noon views" hidden>
    <button class="talabat-view" data-noon-view="noon" type="button">Ratings</button>
    <button class="talabat-view" data-noon-view="noon-performance" type="button">Performance</button>
  </nav>
  <nav class="talabat-view-tabs" id="keetaViewTabs" aria-label="Keeta views" hidden>
    <button class="talabat-view active" data-keeta-view="keeta" type="button">Ratings</button>
    <button class="talabat-view" data-keeta-view="keeta-performance" type="button">Performance</button>
  </nav>

  <main id="mainContent" tabindex="-1">
    <section class="loading-card">Reading the local database…</section>
  </main>

  <aside class="detail-panel" id="detailPanel" aria-hidden="true" aria-labelledby="detailTitle">
    <div class="detail-backdrop" data-close-detail></div>
    <section class="detail-sheet">
      <button class="close-button" data-close-detail aria-label="Close details">×</button>
      <div id="detailContent"></div>
    </section>
  </aside>

  <section class="auth-gate" id="authGate" hidden>
    <form class="auth-card" id="loginForm">
      <div class="auth-brand"><div class="brand-mark" aria-hidden="true"><img src="/brand/mark-dark.svg" class="brand-dark" alt=""><img src="/brand/mark-light.svg" class="brand-light" alt=""></div><div><span class="brand-endorsement">FRB</span><h2>Control Center</h2></div></div>
      <p>Sign in with the username and password provided by your administrator.</p>
      <label>Username<input id="loginUsername" name="username" autocomplete="username" required></label>
      <label>Password<span class="password-input"><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><button type="button" data-toggle-password="loginPassword" aria-label="Show password">Show</button></span></label>
      <p class="form-error" id="loginError" role="alert"></p>
      <button class="primary-button" type="submit">Sign in</button>
    </form>
  </section>

</body>
</html>
