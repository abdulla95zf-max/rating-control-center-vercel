<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Rating Control Center</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/performance.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">RC</div>
    <div class="brand-copy">
      <h1>Online Rating Control Center</h1>
      <p>Marketplace ratings & performance</p>
    </div>
    <div class="refresh-state" id="refreshState">
      <span class="live-dot"></span>
      <span>Loading data…</span>
    </div>
  </header>

  <nav class="platform-tabs" id="platformTabs" aria-label="Platforms">
    <button class="tab active" data-tab="overview"><img class="tab-logo" src="/platforms/overview.svg" alt=""><span class="tab-label">Overview</span></button>
    <button class="tab" data-tab="talabat"><img class="tab-logo" src="/platforms/talabat.svg" alt=""><span class="tab-label">Talabat</span><span class="tab-state">Checking…</span></button>
    <button class="tab" data-tab="keeta"><img class="tab-logo" src="/platforms/keeta.svg" alt=""><span class="tab-label">Keeta</span><span class="tab-state">Not Connected</span></button>
    <button class="tab" data-tab="noon"><img class="tab-logo" src="/platforms/noon.svg" alt=""><span class="tab-label">Noon</span><span class="tab-state">Not Connected</span></button>
    <button class="tab" data-tab="careem"><img class="tab-logo" src="/platforms/careem.svg" alt=""><span class="tab-label">Careem</span><span class="tab-state">Not Connected</span></button>
    <button class="tab" data-tab="deliveroo"><img class="tab-logo" src="/platforms/deliveroo.svg" alt=""><span class="tab-label">Deliveroo</span><span class="tab-state">Not Connected</span></button>
  </nav>

  <nav class="talabat-view-tabs" id="talabatViewTabs" aria-label="Talabat views" hidden>
    <button class="talabat-view active" data-talabat-view="talabat" type="button">Ratings</button>
    <button class="talabat-view" data-talabat-view="performance" type="button">Performance</button>
  </nav>

  <main id="mainContent" tabindex="-1">
    <section class="loading-card">Reading the local database…</section>
  </main>

  <aside class="detail-panel" id="detailPanel" aria-hidden="true" aria-labelledby="detailTitle">
    <div class="detail-backdrop" data-close-detail></div>
    <section class="detail-sheet">
      <button class="close-button" data-close-detail aria-label="Close details">×</button>
      <div id="detailContent"></div>
    </section>
  </aside>
</body>
</html>
